[project]
name = "ligo-o3-ml"
version = "0.1.0"
description = "以機器學習研究 LIGO O3 重力波數據的課程專題"
readme = "README.md"
# 固定 Python 3.11，確保三人環境一致（uv 會自動下載對應版本）
requires-python = ">=3.11,<3.12"
dependencies = [
    # 數值與科學計算
    "numpy",
    "scipy",
    "pandas",
    "h5py",
    # 重力波資料存取與處理
    "gwpy",
    "gwosc",
    # 機器學習
    "scikit-learn",
    "torch",
    # 繪圖
    "matplotlib",
]

# 開發工具（uv sync 預設會一起安裝）
[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "nbstripout",
    "pytest",
    "ruff",
]

# 讓 src/ligo_o3_ml 成為可匯入的共用函式庫
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ligo_o3_ml"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
